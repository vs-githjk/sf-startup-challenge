[project]
name = "sf-startup-challenge"
version = "0.1.0"
description = "SF Startup Challenge 2026 — agent-run startup on Band Desktop + Cognee"
requires-python = ">=3.12,<3.13"
# Pin exact versions: the Snyk score counts every vulnerable dependency.
dependencies = [
    "anthropic==1.16.0",
    "band-sdk[langgraph]==6.0.1",
    "cognee==1.6.5",
    "fastapi==0.156.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
