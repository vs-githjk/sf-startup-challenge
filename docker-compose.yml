# Local infrastructure. Neo4j is Cognee's graph store (extra credit) and the "company brain" view.
# Start:  NEO4J_PASSWORD=<pick one> docker compose up -d neo4j
# Browse: http://localhost:7474  (user neo4j, password from NEO4J_PASSWORD)
services:
  neo4j:
    image: neo4j:5.26
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  neo4j-data:
